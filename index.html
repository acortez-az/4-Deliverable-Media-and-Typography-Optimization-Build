<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Crossing: New Leaf - Nintendo Switch Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="downloads-page-body">

    <header id="top" class="top-bar">
        <div class="logo-box">
            <a href="index.html">
                <img src="Asset inventory/" alt="Website Logo" class="header-logo">
            </a>
        </div>
        <div class="language-selector">
            <select aria-label="Language Selector">
                <option value="en">English (US)</option>
            </select>
        </div>
    </header>

    <section class="banner-section" style="position: relative;">
        <img src="Asset inventory/" alt="Animal Crossing New Leaf Logo" class="overlapping-logo">
        <div class="banner-image-box">
            <img src="Asset inventory/" alt="Hero Image" class="banner-img">
        </div>
    </section>

    <nav class="green-nav">
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="nav-items-container">
            <a href="index.html" class="nav-item">Home</a>
            <a href="downloads.html" class="nav-item">Downloads</a>
            <a href="about.html" class="nav-item">About</a>
            <a href="characters.html" class="nav-item">Characters</a>
            <a href="gallery.html" class="nav-item">Gallery</a>
            <a href="#buy-modal" class="nav-item">Buy Now!</a>
        </div>
    </nav>

    <div class="nav-divider"></div>

    <main class="main-content">
         <div class="wooden-title-banner" style="display: inline-block;">
            <h2>Watch Trailer!</h2>
        </div>

        <div class="trailer-wrapper">
             <div class="char-box char-left">
                <img src="Asset inventory/" alt="Character Left" class="floating-char">
             </div>
        
             <div class="video-container">
                <div class="video-backdrop-box">
                    <iframe 
                        class="video-box" 
                        src="https://www.youtube.com/embed/g2J03Q4nO90" 
                        title="Animal Crossing: New Leaf Trailer" 
                        style="border:0;" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <div class="char-box char-right">
                <img src="Asset inventory/" alt="Character Right" class="floating-char">
            </div>
        </div>
    </main>
