<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Crossing: New Leaf - Nintendo Switch Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="downloads-page-body">

    <header id="top" class="top-bar">
        <div class="logo-box">
            <a href="index.html">
                <img src="Asset inventory/Nintendo.svg.webp" alt="Nintendo Logo" class="header-logo">
            </a>
        </div>
        <div class="language-selector">
            <select aria-label="Language Selector">
                <option value="en">English (US)</option>
            </select>
        </div>
    </header>

    <section class="banner-section" style="position: relative;">

        <img src="Asset inventory/ac_logo.png" alt="Animal Crossing: New Leaf official game logo" class="overlapping-logo">
        
        <div class="banner-image-box">
            <picture>
                <source media="(max-width: 768px)" srcset="Asset inventory/hero-400.png">
    
            <img 
                src="Asset inventory/hero-800.png" 
                srcset="Asset inventory/hero-400.png 400w, 
                        Asset inventory/hero-800.png 800w, 
                        Asset inventory/hero-1200.png 1200w" 
                sizes="(max-width: 768px) 100vw, 700px"
                alt="Animal Crossing: New Leaf promotional banner" 
                class="banner-img">
            </picture>
        </div>
    </section>

    <nav class="green-nav">
        <input type="checkbox" id="nav-toggle" class="nav-toggle">
        <label for="nav-toggle" class="hamburger-btn">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <div class="nav-items-container">
            <a href="#" class="nav-item">Home</a>
            <a href="#" class="nav-item">Downloads</a>
            <a href="#" class="nav-item">About</a>
            <a href="#" class="nav-item">Characters</a>
            <a href="#" class="nav-item">Gallery</a>
            <a href="#" class="nav-item">Buy Now!</a>
        </div>
    </nav>

    <div class="nav-divider"></div>

    <main class="main-content">
         <div class="wooden-title-banner" style="display: inline-block;">
            <h2>Watch The Trailer!</h2>
        </div>

        <div class="trailer-wrapper">
             <div class="char-box char-left">
                <img src="Asset inventory/char1.png" alt="Isabelle Render" class="floating-char">
             </div>
        
             <div class="video-container">
                <div class="video-backdrop-box">
                    <iframe 
                        class="video-box" 
                        src="https://www.youtube.com/embed/g2J03Q4nO90" 
                        title="Animal Crossing: New Leaf Nintendo Switch 2 Edition Trailer" 
                        style="border:0;" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <div class="char-box char-right">
                <img src="Asset inventory/char2.png" alt="Tom Nook Render" class="floating-char">
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-legal-text">
            <p>Wireless broadband Internet access required for online features. For more info, go to <a href="https://support.nintendo.com" target="_blank">support.nintendo.com</a>.</p>
        </div>

        <div class="footer-badges-row">
            <div class="footer-social-col">
                <span class="follow-text">Follow Us:</span>
                <div class="social-icons">
                    <a href="#" aria-label="Facebook"><img src="Asset inventory/facebook.webp" alt=""></a>
                    <a href="#" aria-label="Twitter"><img src="Asset inventory/twitter.webp" alt=""></a>
                    <a href="#" aria-label="YouTube"><img src="Asset inventory/youtube.webp" alt=""></a>
                </div>
                <div class="footer-policy-links">
                    <a href="#">Privacy Notice</a>
                    <a href="#">Terms of Use</a>
                </div>
            </div>

            <div class="footer-badge-item">
                <img src="Asset inventory/esrb.png" alt="ESRB Rating: E for Everyone with mild cartoon violence" class="footer-img-box">
            </div>
        </div>

        <div class="footer-copyright">
            <p>&copy; 2026 Nintendo. Animal Crossing and Nintendo are trademarks of Nintendo.</p>
        </div>
    </footer>
